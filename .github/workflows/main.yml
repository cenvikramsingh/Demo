name: Publish Changes

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export Managed Dynamics 365 Solution
        id: export-dynamics-solution
        uses: dynamics-tools/export-managed-solution@v1.3.0
        with:
          dynamics-url: 'https://hubcoredevsandbox.crm.dynamics.com'
          application-id: '7d5d3f11-5e7c-4c15-b6d3-a1bdf9ce2b29'
          application-secret: ''
          tenant-id: 'a18515c2-3198-4fad-97ed-29a46c974fdb'
          solution-name: 'DnB360'
          version-number: '3.1.6.1'

      - name: Use the output
        run: |
          echo "The file path of the exported solution is ${{ steps.export-dynamics-solution.outputs.exported_file_path }}"
          echo "The base64 encoded data of the exported solution is ${{ steps.export-dynamics-solution.outputs.exported_file_base64 }}"
